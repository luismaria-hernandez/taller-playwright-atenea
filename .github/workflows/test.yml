name: CI - clonando app y ejecutando tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: ${{secrets.MONGO_URI}}
      JWT_SECRET: ${{secrets.JWT_SECRET}}
      PORT: 6007
      VITE_API_URL: http://localhost:6007/api #este es el puerto en donde se va a exponer la API de la base de datos

    steps:
        - name: Checkout repo actual (con el workflow)
          uses: actions/checkout@v3
        - name: Clonar repo Athenea Redux Bank
          run: |
            git clone https://github.com/luismaria-hernandez/taller-playwright-atenea.git app
        - name: Crear carpeta backend
          run: mkdir -p app/backend
        - name: Crear archivo .env para el backend
          run: |
              echo "MONGO_URI=${{env.MONGO_URI}}" >> app/backend/.env
              echo "JWT_SECRET=${{env.JWT_SECRET}}" >> app/backend/.env
              echo "PORT=${{env.PORT}}" >> backend >> app/backend/.env
              echo "VITE_API_URL=${{env.VITE_API_URL}}" >> app/backend/.env
        - name: Instalar dependecias de backend
          run: |
            cd app/backend
            npm install
        - name: Construir backend
          run: |
            cd app/backend
            npm run start:backend &
        #La última expresión es un standard para poder levantar el servicio

        #Se instala la herramienta wait-on de manera global
        - name: Instalar wait-on
          run: npm install -g wait-on

        #Vamos a esperar que se levante el puerto del backend  
        - name: Esperar Backend
          run: npx wait-on tcp:6007

        #creamos la carpeta de frontend
        - name: Crear la carpeta de frontend
          run: mkdir -p app/frontend

        #instalar dependencias del front end
        - name: Instalar dependencia front end
          run: |
            cd app/frontend
            npm install
          env: 
            VITE_API_URL: ${{env.VITE_API_URL}}
            run: wait-on http://localhost:3000

          